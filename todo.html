<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List with LocalStorage</title>
  <link rel="stylesheet" href="style.css">


 

</head>
<body>
  <div class="globe globe1"></div>
  <div class="globe globe2"></div>
  <div class="globe globe3"></div>

  <div class="container">
    <h2>✨  Todo  List ✨</h2>
    <div class="input-area">
      <input type="text" id="taskInput" placeholder="Enter a task">
      <button onclick="addTask()">Add</button>
    </div>
    <ul id="taskList"></ul>
    <button id="deleteAllBtn" class="delete-all-btn" onclick="deleteAllTasks()">Delete All</button>
  </div>

 
  <script src="script.js"></script>

</body>
</html>
